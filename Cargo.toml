[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Koko contributors"]
description = "An in-memory, embeddable property-graph database written in Rust."

[workspace.dependencies]
# Internal crates (per-layer; the dependency DAG enforces layering at compile time).
koko-common = { path = "crates/koko-common" }
koko-catalog = { path = "crates/koko-catalog" }
koko-storage = { path = "crates/koko-storage" }
koko-parser = { path = "crates/koko-parser" }
koko-function = { path = "crates/koko-function" }
koko-binder = { path = "crates/koko-binder" }
koko-expr = { path = "crates/koko-expr" }
koko-planner = { path = "crates/koko-planner" }
koko-processor = { path = "crates/koko-processor" }
koko-loader = { path = "crates/koko-loader" }
koko = { path = "crates/koko" }

# External crates.
thiserror = "2"
clap = "4.6"
reedline = "0.49"
crossterm = "0.29"
nu-ansi-term = "0.50"
serde = "1"
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
toml_edit = "0.25"
directories = "6"
unicode-width = "0.2"
ctrlc = "3.5"
base64 = "0.22"
strsim = "0.11"
fd-lock = "4"
portable-pty = "0.9"
assert_cmd = "2"
predicates = "3"
proptest = "1"
bytes = "1"
csv = "1"
regex = "1"
unicode-segmentation = "1"
flate2 = "1"
glob = "0.3"
arrow-array = "55"
arrow-buffer = "55"
arrow-schema = "55"
parquet = { version = "55", default-features = false, features = ["arrow", "brotli", "flate2", "lz4", "snap", "zstd"] }
tempfile = "3"
thrift = "0.17"
npyz = "0.9.1"

[profile.release]
opt-level = 3
lto = "thin"
